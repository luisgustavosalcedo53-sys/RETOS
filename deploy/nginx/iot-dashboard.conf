# /etc/nginx/sites-available/iot-dashboard
# Cambia TU_DOMINIO por el dominio real o usa "_" si vas a entrar por IP.
# Express escucha solo en 127.0.0.1:3000; Nginx es el único acceso público.

server {
    listen 80;
    listen [::]:80;
    server_name TU_DOMINIO;

    client_max_body_size 1m;
    server_tokens off;

    # WebSocket de Socket.IO: necesita Upgrade/Connection.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# Después de comprobar HTTP, ejecuta Certbot para añadir HTTPS:
#   sudo certbot --nginx -d TU_DOMINIO
# Luego activa TRUST_PROXY=true y ENABLE_HSTS=true en .env.
