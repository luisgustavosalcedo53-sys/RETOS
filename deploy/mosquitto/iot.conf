# /etc/mosquitto/conf.d/iot.conf
# Configuración final recomendada para el proyecto.
# Copia este archivo al servidor con:
#   sudo nano /etc/mosquitto/conf.d/iot.conf
# No guardes contraseñas en este archivo.

listener 1883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/pwfile
acl_file /etc/mosquitto/aclfile

# Persistencia y registro. Ubuntu crea /var/lib/mosquitto y /var/log/mosquitto
# con el usuario mosquitto; si no existen, revisa los permisos antes de reiniciar.
persistence true
persistence_location /var/lib/mosquitto/
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
connection_messages true

# ------------------------------------------------------------
# TLS opcional (recomendado si tienes dominio y certificados)
# Descomenta y ajusta las rutas cuando los certificados existan.
# El puerto 8883 no sustituye a la autenticación ni a la ACL.
# ------------------------------------------------------------
# listener 8883 0.0.0.0
# cafile /etc/mosquitto/certs/ca.crt
# certfile /etc/mosquitto/certs/server.crt
# keyfile /etc/mosquitto/certs/server.key
# tls_version tlsv1.2
